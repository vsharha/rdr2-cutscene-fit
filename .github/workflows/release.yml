name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the project version
        run: |
          version=$(sed -n 's/^project(CutsceneFit VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the CMake project version $version (expected v$version)."
            exit 1
          fi

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++-mingw-w64-x86-64-posix

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
          -DCUTSCENEFIT_MINGW_SUFFIX=-posix
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SKIP_INSTALL_ALL_DEPENDENCY=ON

      - name: Build
        run: cmake --build build --target CutsceneFit

      - name: Package
        run: cmake --build build --target package

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" build/CutsceneFit-*.zip
          --title "CutsceneFit $GITHUB_REF_NAME"
          --notes-file dist/release-notes.md
