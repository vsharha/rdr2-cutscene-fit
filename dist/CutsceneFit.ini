[CutsceneFit]
; 1 installs the plugin's hooks, 0 loads it and does nothing.
enabled=1
; 1 shows the bars when the game starts, 0 hides them (the scene behind them is then rendered). Works on any screen.
bars=1
; Key that shows or hides the bars on any screen: a name (F1-F24, A-Z, 0-9, End, Home, Insert, Delete,
; PageUp, PageDown, arrow keys, ...) or a virtual-key code such as 0x23.
toggle_key=End
; cut: narrow the field of view from the first camera cut after the letterbox appears
; until it disappears. letterbox: narrow it whenever the letterbox is enabled.
zoom_start=cut
; Screen aspect ratio. 0 measures the game window's client area once a second.
aspect=0
; 1 writes CutsceneFit.log next to the .asi, 0 writes nothing.
log=1
